name: CI

# Fast checks on every pull request and on pushes to the long-lived branches.
# No store or signing credentials are used anywhere in this file.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    # A bound, so a stuck or missing runner shows up as a failure
    # instead of a check that waits forever.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      # The publish workflow may only be started by the approval workflow.
      # This step fails the build if it ever gains another trigger. It must
      # stay a hard failure: never mark it continue-on-error.
      - name: Guard the publish trigger
        run: scripts/check-publish-trigger.sh

      # Tests for the optional add-ons. They run the real scripts against
      # fakes in temporary folders and need no credentials.
      - name: Test the add-ons
        run: scripts/test-addons.sh
