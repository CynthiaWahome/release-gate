name: Secret scan

# Looks for committed secrets on every pull request and push, plus a weekly
# sweep so a leak already in history is not left waiting for the next push.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Needed to look up a pull request's commit range.
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The scan covers history, so it needs every commit.
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only needed when the repository belongs to an organisation.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
