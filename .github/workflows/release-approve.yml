name: "Release 2: Approve and publish"

# The only workflow allowed to call _publish.yml. Every rule is in SPEC.md,
# section 2 (Approve). Anything unreadable or missing counts as "no".
on:
  pull_request_review:
    types: [submitted]

env:
  # Kept in the workflow, not read from CODEOWNERS at run time, so changing who
  # can release is always a visible diff. Replace with your own logins.
  ALLOWED_APPROVERS: "CynthiaWahome wamzii"

# One approval run at a time per pull request (SPEC.md, supporting rules).
concurrency:
  group: release-approve-${{ github.event.pull_request.number }}
  cancel-in-progress: false
  # Keep every waiting run: the default replaces a waiting approval.
  queue: max

jobs:
  verify:
    name: Verify the approval
    # Checked before the job starts, so unrelated reviews never run it
    # (SPEC.md, Approve rules 1 to 4).
    if: >-
      github.event.pull_request.base.ref == 'release-gate' &&
      github.event.review.state == 'approved' &&
      github.event.pull_request.user.login == 'github-actions[bot]' &&
      startsWith(github.event.pull_request.head.ref, 'release-request/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      actions: read # read the request run record (check 3c)
    outputs:
      approved: ${{ steps.check.outputs.approved }}
      tampered: ${{ steps.check.outputs.tampered }}
      app: ${{ steps.check.outputs.app }}
      track: ${{ steps.check.outputs.track }}
      requested_by: ${{ steps.check.outputs.requested_by }}
      head_sha: ${{ steps.check.outputs.head_sha }}
    steps:
      - name: Check approver, request file and self-approval
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          APPROVER: ${{ github.event.review.user.login }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          # A refusal about a person or timing: comment, publish nothing.
          deny() {
            echo "::error::$1"
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "Release not started: $1" || true
            echo "approved=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          # A refusal that means the request cannot be trusted: the quarantine job
          # closes it. See SPEC.md, rules for failure.
          deny_tampered() {
            echo "::error::$1"
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "Release not started: $1 This request cannot be trusted, so it is being closed. Start a new release request." || true
            echo "approved=false" >> "$GITHUB_OUTPUT"
            echo "tampered=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          # An unexpected failure leaves approved unset, so publish is skipped.

          lower() { tr '[:upper:]' '[:lower:]' <<< "$1"; }
          # Non-empty lines of $1. Every API read is checked before this is used, so a
          # failed read never looks like an empty list.
          lines() { grep . <<< "$1" || true; }
          approver="$(lower "$APPROVER")"

          # Rule 5: the approver is on the list (compared without regard to case).
          allowed=false
          for name in $ALLOWED_APPROVERS; do
            if [[ "$(lower "$name")" == "$approver" ]]; then allowed=true; fi
          done
          [[ "$allowed" == "true" ]] || deny "@$APPROVER is not an authorised release approver. This request still needs an authorised approval."

          # Rule 6: open, and no force-push, restore or reopen in the event log.
          pr_state="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.state')" \
            || deny "the pull request state could not be read."
          [[ "$pr_state" == "open" ]] \
            || deny "this request is $pr_state. A closed request cannot be approved; start a new release request."
          events="$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/events" --jq '.[].event')" \
            || deny "the pull request history could not be read."
          bad_events="$(grep -E '^(head_ref_force_pushed|head_ref_restored|reopened)$' <<< "$events" | sort -u | paste -sd, - || true)"
          [[ -z "$bad_events" ]] \
            || deny_tampered "the request history shows: $bad_events. A legitimate request is never force-pushed, restored or reopened."

          # Rule 7: exactly one request file, found by path across every page.
          files_out="$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" \
            --jq '.[] | select(.filename | startswith("release-requests/")) | select(.filename | endswith(".json")) | .filename')" \
            || deny "the pull request's changed files could not be read."
          mapfile -t files < <(lines "$files_out")
          [[ "${#files[@]}" -eq 1 ]] || deny_tampered "expected exactly one request file under release-requests/, found ${#files[@]}."
          request_file="${files[0]}"

          # Rule 8: read the request at the approved commit.
          request_json="$(gh api "repos/$REPO/contents/$request_file?ref=$HEAD_SHA" --jq '.content' | base64 --decode)" \
            || deny "the request file could not be read."
          app="$(jq -er '.app // empty' <<< "$request_json")" || deny_tampered "the request file has no app."
          track="$(jq -er '.track // empty' <<< "$request_json")" || deny_tampered "the request file has no track."
          requested_by="$(jq -er '.requested_by // empty' <<< "$request_json")" || deny_tampered "the request file has no requested_by."
          stored_commit="$(jq -er '.commit // empty' <<< "$request_json")" || deny_tampered "the request file has no commit."

          # Rule 9: exactly one commit touches the request file, it is the PR head, and
          # its parent is the recorded source commit. Author text is never trusted.
          touching_out="$(gh api --method GET --paginate "repos/$REPO/commits" \
            -f path="$request_file" -f sha="$HEAD_SHA" \
            --jq '.[] | .sha')" \
            || deny "the request file's history could not be read."
          mapfile -t touching < <(lines "$touching_out")
          [[ "${#touching[@]}" -eq 1 ]] || deny_tampered "expected exactly one commit to touch $request_file, found ${#touching[@]}."
          touching_sha="${touching[0]}"
          [[ "$touching_sha" == "$HEAD_SHA" ]] || deny_tampered "the request file was modified after the PR was opened."
          parent_sha="$(gh api "repos/$REPO/commits/$HEAD_SHA" --jq '.parents[0].sha // empty')"
          [[ -n "$parent_sha" ]] || deny_tampered "the commit that wrote the request file has no parent commit."
          [[ "$parent_sha" == "$stored_commit" ]] || deny_tampered "the request commit is not based on the source commit recorded in the request."

          # Rule 10: the requester comes from the request run record (its id ends the
          # branch name), not from the file, which anyone with push access can rewrite.
          run_id="${HEAD_REF##*-}"
          [[ "$run_id" =~ ^[0-9]+$ ]] || deny_tampered "the request branch name does not end in a request run id."
          run_json="$(gh api "repos/$REPO/actions/runs/$run_id")" \
            || deny "the request run $run_id could not be read."
          jq -e --arg branch "$DEFAULT_BRANCH" --arg sha "$stored_commit" '
              .event == "workflow_dispatch"
              and .path == ".github/workflows/release-request.yml"
              and .head_branch == $branch
              and .head_sha == $sha' <<< "$run_json" > /dev/null \
            || deny_tampered "request run $run_id was not a manual run of the request workflow on $DEFAULT_BRANCH at the recorded source commit."
          run_actor="$(jq -er '.actor.login // empty' <<< "$run_json")" \
            || deny_tampered "the request run $run_id has no recorded actor."
          [[ "$(lower "$run_actor")" == "$(lower "$requested_by")" ]] \
            || deny_tampered "the request file names @$requested_by, but @$run_actor started the request run. The request file was replaced."
          requested_by="$run_actor"

          # Rule 11: the approved commit changes the request file and nothing else.
          changed_out="$(gh api "repos/$REPO/commits/$HEAD_SHA" \
            --jq '.files[] | .filename, (.previous_filename // empty)')" \
            || deny "the request commit's changed files could not be read."
          mapfile -t changed < <(lines "$changed_out")
          [[ "${#changed[@]}" -eq 1 && "${changed[0]}" == "$request_file" ]] \
            || deny_tampered "the request commit changes files other than $request_file."

          # Rule 12: app and track are on the lists, read from the default branch.
          config_json="$(gh api "repos/$REPO/contents/release.config.json?ref=$DEFAULT_BRANCH" --jq '.content' | base64 --decode)" \
            || deny "release.config.json could not be read from $DEFAULT_BRANCH."
          jq -e --arg v "$app" '.apps | index($v)' <<< "$config_json" > /dev/null || deny "the requested app is not in release.config.json."
          jq -e --arg v "$track" '.tracks | index($v)' <<< "$config_json" > /dev/null || deny "the requested track is not in release.config.json."

          # Rule 16: nobody approves their own request.
          [[ "$(lower "$requested_by")" != "$approver" ]] || deny "@$APPROVER requested this release, so their own approval does not count. A different authorised approver is needed."

          # Rule 13: the review is for the exact head commit and carries its id.
          review_commit="${{ github.event.review.commit_id }}"
          [[ -n "$review_commit" && "$review_commit" == "$HEAD_SHA" ]] || deny "the review was not submitted for the PR head $HEAD_SHA (it was for '${review_commit:-no commit}'). Review the current head."

          {
            echo "approved=true"
            echo "app=$app"
            echo "track=$track"
            echo "requested_by=$requested_by"
            echo "head_sha=$HEAD_SHA"
          } >> "$GITHUB_OUTPUT"
          echo "Approval by @$APPROVER accepted for $app -> $track (requested by @$requested_by)."

  # Closes a tampered request and deletes its branch. A separate job so the
  # check job stays read-only on contents (SPEC.md, rules for failure).
  quarantine:
    name: Close a tampered request
    needs: verify
    if: needs.verify.outputs.tampered == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      contents: write # delete the request branch
    steps:
      - name: Close the pull request and delete its branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # Close and delete are separate and repeatable: already done counts as done.
          pr_state="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json state --jq .state)"
          if [[ "$pr_state" == "OPEN" ]]; then gh pr close "$PR_NUMBER" --repo "$REPO"; fi
          # Only a 404 means the branch is already gone; any other failure is reported.
          if ref_out="$(gh api "repos/$REPO/git/ref/heads/$HEAD_REF" 2>&1)"; then
            gh api --method DELETE "repos/$REPO/git/refs/heads/$HEAD_REF"
          elif grep -q "HTTP 404" <<< "$ref_out"; then
            echo "Request branch already deleted."
          else
            echo "::error::Could not check the request branch, so it may still exist: $ref_out"
            exit 1
          fi
          # Fail on purpose so a tampered request shows as a red run.
          echo "::error::Request #$PR_NUMBER was refused as tampered with and has been closed. See the comment on the pull request."
          exit 1

  # The one call site of the publish workflow. Named by repository and branch,
  # not by a relative path: a review-triggered run resolves a relative path
  # against the pull request. AFTER USING THIS TEMPLATE, change the owner and
  # repository below to your own.
  publish:
    name: Publish the approved release
    needs: verify
    if: needs.verify.outputs.approved == 'true'
    uses: CynthiaWahome/release-gate/.github/workflows/_publish.yml@dev
    # A called workflow can never have more permission than this job grants.
    permissions:
      contents: read
      pull-requests: read
    with:
      app: ${{ needs.verify.outputs.app }}
      track: ${{ needs.verify.outputs.track }}
      requested_by: ${{ needs.verify.outputs.requested_by }}
      approved_by: ${{ github.event.review.user.login }}
      request_url: ${{ github.event.pull_request.html_url }}
      head_sha: ${{ needs.verify.outputs.head_sha }}
    secrets: inherit

  finish:
    name: Close or keep the request
    needs: [verify, publish]
    # always(): this must report even when the publish failed.
    if: always() && needs.verify.outputs.approved == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      contents: write # delete the request branch after a successful publish
    steps:
      - name: Comment and close on success, keep open on failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RESULT: ${{ needs.publish.result }}
          UPLOAD_REACHED: ${{ needs.publish.outputs.upload_reached }}
          APPROVER: ${{ github.event.review.user.login }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ "$RESULT" == "success" ]]; then
            # The comment is best effort: a failed comment must never stop the close.
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "Approved by @$APPROVER. Publish completed." || true
            gh pr close "$PR_NUMBER" --repo "$REPO" --delete-branch
          elif [[ "$UPLOAD_REACHED" != "false" ]]; then
            # "true" means the upload began; empty means we cannot tell (for example a
            # lost runner). Either way the store may have the release, so close the
            # request and let the guard refuse a re-run. The comment is best effort.
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "Approved by @$APPROVER, but the publish failed (result: \`$RESULT\`) and the store upload may have started. The store may or may not have the release. Check the store first. This request is closed so it cannot be re-run. If a release is still needed, start a new release request. Run: $RUN_URL" || true
            gh pr close "$PR_NUMBER" --repo "$REPO" --delete-branch
            echo "::error::Publish failed and the upload may have started. Request #$PR_NUMBER closed. Check the store before releasing again."
          else
            # The approval was valid and the failure is usually infrastructure: keep the
            # request open so a re-run can retry the same approval (SPEC.md).
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "Approved by @$APPROVER, but the publish did not succeed (result: \`$RESULT\`). The upload had not started, so nothing reached the store. If this request is still open and unchanged, fix the cause and re-run the failed jobs here: $RUN_URL. If it was closed or changed, the publish guard refuses it for good: start a new release request."
            echo "::notice::Publish result was $RESULT. Request #$PR_NUMBER left open for retry."
          fi
